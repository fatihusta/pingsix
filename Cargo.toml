[package]
name = "pingsix"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"

[workspace]
members = [".", "pingsix-macros"]
resolver = "2"

[dependencies]
pingsix-macros = { path = "pingsix-macros" }
arc-swap = "1.7.1"
async-trait = "0.1.42"
base64 = "0.22.1"
bytes = "1.0"
dashmap = "5"
env_logger = { version = "0.11.5", features = ["unstable-kv"] }
etcd-client = { version = "0.18.0", features = ["tls"] }
futures = "0.3"
hmac = "0.12.1"
hex = "0.4"
hickory-resolver = "0.26"
http = "1"
ipnetwork = { version = "0.21.1", features = ["serde"] }
jsonwebtoken = "9.3.1"
libc = "0.2"
log = { version = "0.4", features = ["kv"] }
matchit = "0.8.4"
once_cell = "1"
pingora = { version = "0.9.0", features = ["openssl", "sentry"] }
pingora-cache = "0.9.0"
pingora-core = "0.9.0"
pingora-error = "0.9.0"
pingora-http = "0.9.0"
pingora-limits = "0.9.0"
pingora-load-balancing = "0.9.0"
pingora-proxy = "0.9.0"
pingora-prometheus = "0.9.0"
pingora-runtime = "0.9.0"
prometheus = "0.14"
rand = "0.8"
regex = "1.11.1"
sentry = "0.36"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.12.0"
# serde_yml is the actively maintained fork of the unmaintained serde_yaml 0.9.
serde_yml = "0.0.13"
sha2 = "0.10.9"
subtle = "2.6.1"
smallvec = "1"
tokio = { version = "1.41.1", features = ["fs", "rt", "time", "sync", "net"] }
tokio-util = "0.7"
uuid = { version = "1.16.0", features = ["v4", "v7"] }
url = "2.5"
validator = { version = "0.20.0", features = ["derive"] }
aes-gcm = "0.10"
argon2 = "0.5"
jsonschema = { version = "0.49.9", default-features = false }

[features]
# Exposes `utils::testing` (mock-IO/session helpers) to tests/ and benches/,
# which link the library without cfg(test). Off by default; release builds
# are unaffected.
test-utils = []

[dev-dependencies]
# Self dev-dependency: enables `test-utils` on the library so integration
# tests and benches can `use pingsix::utils::testing`.
pingsix = { path = ".", features = ["test-utils"] }
criterion = "0.5"
etcd-client = { version = "0.18.0", features = ["tls"] }
jsonwebtoken = "9.3.1"
rustls = "0.23"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.41.1", features = ["rt", "rt-multi-thread", "macros"] }

[[bench]]
name = "plugin_pipeline"
harness = false

[[bench]]
name = "route_matching"
harness = false

[profile.release]
lto = "thin"
strip = "symbols"
